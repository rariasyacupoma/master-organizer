<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020714"/>
      <stop offset="100%" stop-color="#0d1035"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Hex background -->
  <polygon points="50,4 89.8,27 89.8,73 50,96 10.2,73 10.2,27" fill="url(#bg)"/>
  <!-- MO text -->
  <text x="50" y="62" font-family="'Courier New', monospace" font-size="36" font-weight="700"
        fill="#38bdf8" text-anchor="middle" filter="url(#glow)" opacity="0.95">MO</text>
  <!-- Hex border -->
  <polygon points="50,4 89.8,27 89.8,73 50,96 10.2,73 10.2,27"
           fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
</svg>
