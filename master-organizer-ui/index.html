<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Organizer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #d4d4d4;
      --muted: #525252;
      --accent: #22c55e;

      --status-in_progress: #60a5fa;
      --status-blocked: #f87171;
      --status-waiting: #fbbf24;
      --status-new: #34d399;
    }

    /* ── Single knob: change this to scale all fonts ── */
    html { font-size: 20px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1rem;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 1rem; font-weight: 600; letter-spacing: .05em; color: var(--text); display: flex; align-items: center; gap: 8px; }
    header h1 img { width: 56px; height: 56px; }

    .stats {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .stats span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 8px;
      padding: 3px;
    }
    .view-toggle button {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all .15s;
    }
    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    /* ── Sync button ── */
    #sync-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
      transition: all .15s;
    }
    #sync-btn:hover { border-color: var(--accent); color: var(--text); }
    #sync-btn.syncing { opacity: .6; pointer-events: none; }
    #sync-btn.success { border-color: #22c55e; color: #22c55e; }
    #sync-btn.error   { border-color: #ef4444; color: #ef4444; }

    /* ── Main ── */
    main { padding: 24px; }

    /* ── Status badge ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge.in_progress  { background: #1a2535; color: var(--status-in_progress); }
    .badge.blocked      { background: #2a1a1a; color: var(--status-blocked); }
    .badge.waiting      { background: #2a2010; color: var(--status-waiting); }
    .badge.new          { background: #102a1a; color: var(--status-new); }

    /* ── PR list ── */
    .prs-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .pr-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .pr-repo {
      font-size: 0.7rem;
      color: #52525b;
      white-space: nowrap;
      min-width: 0;
    }
    .pr-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #9ca3af;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      transition: color .15s;
    }
    .pr-link:hover { color: var(--text); }
    .pr-link.merged { color: #6b7280; }
    .pr-link .check { color: #22c55e; }
    .pr-link .pending { color: #f59e0b; }
    .pr-version {
      font-family: monospace;
      font-size: 0.65rem;
      color: #71717a;
    }
    .pr-env-tags {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }
    .env-tag {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: .05em;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .env-tag.on      { }
    .env-tag.off     { background: transparent; color: #3f3f46; border: 1px solid #27272a; }
    .env-tag.queued-on  { background: #2a1f0e; color: #fbbf24; border: 1px solid #78350f; }
    .env-tag.queued-off { background: transparent; color: #3f3f46; border: 1px solid #27272a; }
    .env-tag.qa-on   { background: #0e2a30; color: #22d3ee; border: 1px solid #164e63; }
    .env-tag.qa-off  { background: transparent; color: #3f3f46; border: 1px solid #27272a; }
    .env-tag.prod-on  { background: #1a2e0e; color: #4ade80; border: 1px solid #166534; }
    .env-tag.prod-off { background: transparent; color: #3f3f46; border: 1px solid #27272a; }

    /* ══════════════════════════════════
       VIEW A — Grid Cards
    ══════════════════════════════════ */
    #view-grid { display: none; }
    #view-grid.active { display: block; }

    .epic-group { margin-bottom: 28px; }
    .epic-group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .epic-group-header a {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #818cf8;
      text-decoration: none;
    }
    .epic-group-header a:hover { color: #a5b4fc; text-decoration: underline; }
    .epic-group-chevron {
      font-size: 0.65rem;
      color: var(--muted);
      transition: transform .2s;
      margin-left: auto;
    }
    .epic-group.collapsed .epic-group-chevron { transform: rotate(-90deg); }
    .epic-group-body { display: block; }
    .epic-group.collapsed .epic-group-body { display: none; }
    .epic-group-count {
      font-size: 0.75rem;
      font-weight: 600;
      color: #c7d2fe;
      background: #3730a3;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .epic-group-none .epic-group-header a { color: var(--muted); }
    .epic-group-none .epic-group-count { color: var(--muted); background: var(--border); }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transition: border-color .15s;
      cursor: pointer;
    }
    .card:hover { border-color: #3a3a3a; }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .card-id {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
      margin-top: 1px;
    }
    .card-id:hover { text-decoration: underline; }
    .card-title {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .service-tag {
      font-size: 0.9rem;
      padding: 2px 6px;
      background: var(--border);
      border-radius: 4px;
      color: var(--muted);
    }

    .stage-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-left: auto;
      white-space: nowrap;
    }

    .latest-update {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .latest-update-title {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #5eead4;
      margin-bottom: 5px;
    }
    .latest-update p {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0;
    }

    .next-steps {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .next-steps-title {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #f0abfc;
      margin-bottom: 6px;
    }
    .next-steps ol {
      margin: 0;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .next-steps li {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .prs-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* ── Toast notifications ── */
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #1e1e2e;
      border: 1px solid #3730a3;
      border-radius: 10px;
      padding: 12px 18px;
      color: #c7d2fe;
      font-size: 0.8rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.5);
      animation: toast-in .2s ease;
      max-width: 320px;
    }
    .toast-icon { font-size: 1.1rem; flex-shrink: 0; }
    .toast-body { display: flex; flex-direction: column; gap: 2px; }
    .toast-title { font-weight: 700; color: #e0e7ff; }
    .toast-msg   { font-size: 0.7rem; color: #818cf8; }
    .toast-close {
      margin-left: auto;
      background: none;
      border: none;
      color: #4f46e5;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 0 0 8px;
      line-height: 1;
      flex-shrink: 0;
    }
    .toast-close:hover { color: #c7d2fe; }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Working indicator ── */
    .working-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.65rem;
      color: #22c55e;
      padding: 2px 0;
    }
    .working-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
      animation: working-pulse 2s ease-in-out infinite;
    }
    .working-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #22c55e;
    }
    .working-since {
      margin-left: auto;
      font-size: 0.58rem;
      color: #4ade80;
      opacity: 0.7;
    }
    @keyframes working-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ── Plan overlay ── */
    #plan-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      z-index: 200;
      flex-direction: column;
    }
    #plan-overlay.visible { display: flex; }

    #plan-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #plan-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all .15s;
    }
    #plan-back:hover { border-color: var(--accent); color: var(--text); }
    #plan-ticket-id { font-size: 0.8rem; font-weight: 700; color: var(--accent); }

    #plan-body {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    #plan-body h1 { font-size: 1.2rem; color: var(--text); margin-bottom: 20px; }
    #plan-body h2 { font-size: 0.95rem; color: #a1a1aa; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    #plan-body h3 { font-size: 0.85rem; color: #71717a; margin: 16px 0 8px; }
    #plan-body p  { font-size: 0.8rem; color: #71717a; line-height: 1.6; margin-bottom: 10px; }
    #plan-body ul, #plan-body ol { padding-left: 20px; margin-bottom: 10px; }
    #plan-body li { font-size: 0.8rem; color: #71717a; line-height: 1.6; }
    #plan-body strong { color: #a1a1aa; }
    #plan-body code { background: #1c1c1c; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 0.75rem; color: #7aa2c8; }
    #plan-body pre { background: #1c1c1c; border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; margin-bottom: 12px; }
    #plan-body pre code { background: none; border: none; padding: 0; }
    #plan-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .focus-btn {
      align-self: flex-start;
      background: #16192a;
      border: 1px solid #35395a;
      color: #7880a4;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 5px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: .03em;
      transition: all .15s;
    }
    .focus-btn:hover { background: var(--accent); border-color: var(--accent); color: #0d0d0d; }
    .focus-btn.ok    { background: #102a1a; border-color: #34d399; color: #34d399; }
    .focus-btn.err   { background: #2a1a1a; border-color: #f87171; color: #f87171; }

    /* ══════════════════════════════════
       VIEW B — Compact Table
    ══════════════════════════════════ */
    #view-table { display: none; }
    #view-table.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    tbody tr:hover { background: var(--surface); }
    tbody td {
      padding: 10px 12px;
      vertical-align: top;
    }
    .td-id { white-space: nowrap; }
    .td-title { max-width: 260px; font-size: 0.75rem; line-height: 1.4; }
    .td-services { white-space: nowrap; }
    .td-next { font-size: 0.7rem; color: var(--muted); max-width: 300px; line-height: 1.4; }
    .td-prs { white-space: nowrap; }

    /* ── Side panel ── */
    .app-body {
      display: flex;
      align-items: flex-start;
    }
    .sidepanel {
      width: 210px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      min-height: calc(100vh - 57px);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: width .2s, padding .2s;
      overflow: hidden;
    }
    .sidepanel.collapsed {
      width: 36px;
      padding: 16px 6px;
    }
    .sidepanel.collapsed .panel-content { display: none; }

    .sidebar-toggle {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 4px;
      align-self: flex-end;
      transition: color .15s;
      flex-shrink: 0;
    }
    .sidebar-toggle:hover { color: var(--text); }

    .panel-section-title {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #6b7280;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .panel-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 500;
      transition: all .15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-btn:hover  { background: var(--border); color: #d4d4d8; }
    .panel-btn.ok     { color: #6ee7b7; background: #052e1c; }
    .panel-btn.err    { color: #fca5a5; background: #2d1515; }
    .panel-btn.busy   { opacity: .5; pointer-events: none; }

    /* db env color hints */
    .panel-btn[data-env="local"]      { color: #52525b; }
    .panel-btn[data-env="staging"]    { color: #78716c; }
    .panel-btn[data-env="production"] { color: #854d4d; }
    .panel-btn[data-env="preprod"]    { color: #7c6f52; }
    .panel-btn[data-env="qa"]         { color: #5f6b7a; }
    .panel-btn[data-env="local"]:hover,
    .panel-btn[data-env="staging"]:hover,
    .panel-btn[data-env="production"]:hover,
    .panel-btn[data-env="preprod"]:hover,
    .panel-btn[data-env="qa"]:hover   { color: #d4d4d8; }

    /* ── Deployments button ── */
    #deploy-view-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 500;
      transition: all .15s;
    }
    #deploy-view-btn:hover { border-color: #f59e0b; color: #f59e0b; }

    /* ── Deployments overlay ── */
    #deploy-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d0d0d;
      z-index: 200;
      flex-direction: column;
    }
    #deploy-overlay.visible { display: flex; }

    #deploy-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    #deploy-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      transition: all .15s;
    }
    #deploy-back:hover { border-color: #f59e0b; color: var(--text); }
    #deploy-title { font-size: 0.85rem; font-weight: 700; color: var(--text); }
    #deploy-updated { font-size: 0.6rem; color: var(--muted); margin-left: auto; }

    #deploy-body {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }

    .deploy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .deploy-env-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .deploy-env-header {
      padding: 12px 20px;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      border-bottom: 1px solid var(--border);
    }
    .deploy-env-header.qa   { color: #22d3ee; border-top: 2px solid #22d3ee; }
    .deploy-env-header.prod { color: #f59e0b; border-top: 2px solid #f59e0b; }

    .deploy-table {
      width: 100%;
      border-collapse: collapse;
    }
    .deploy-table th {
      text-align: left;
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
    }
    .deploy-table td {
      padding: 7px 20px;
      font-size: 0.7rem;
      border-bottom: 1px solid #1a1a1a;
      vertical-align: middle;
    }
    .deploy-table tr:last-child td { border-bottom: none; }
    .deploy-table tr:hover td { background: #1a1a1a; }

    .deploy-service { color: var(--text); font-weight: 500; }
    .deploy-version { color: #a1a1aa; font-family: monospace; font-size: 0.65rem; }
    .deploy-date    { color: var(--muted); font-size: 0.6rem; white-space: nowrap; }

    /* diff highlights */
    .deploy-version.ahead  { color: #4ade80; }
    .deploy-version.behind { color: #f87171; }
    .deploy-version.only   { color: #94a3b8; font-style: italic; }

    /* diff legend */
    .deploy-legend {
      display: flex;
      gap: 20px;
      margin: 0 auto 20px;
      max-width: 1400px;
      font-size: 0.6rem;
    }
    .deploy-legend span { display: flex; align-items: center; gap: 5px; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* ── Tilt sidebar section ── */
    .tilt-active-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #0f1f1a;
      border: 1px solid #1a3a2a;
      margin-bottom: 6px;
    }
    .tilt-active-id {
      font-size: 0.6rem;
      font-weight: 700;
      color: #34d399;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tilt-switching {
      font-size: 0.55rem;
      color: #fbbf24;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    .tilt-main-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid var(--border);
      color: #6b7280;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.6rem;
      font-weight: 600;
      transition: all .15s;
      margin-bottom: 4px;
    }
    .tilt-main-btn:hover { border-color: #34d399; color: #34d399; }
    .tilt-main-btn.active { border-color: #34d399; color: #34d399; background: #0f1f1a; }

    .watcher-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }
    .watcher-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .watcher-dot.on  { background: #34d399; }
    .watcher-dot.off { background: #52525b; }
    .watcher-label {
      font-size: 0.55rem;
      color: #52525b;
      flex: 1;
    }
    .watcher-btn {
      background: none;
      border: 1px solid var(--border);
      color: #52525b;
      cursor: pointer;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.5rem;
      font-weight: 600;
      transition: all .15s;
    }
    .watcher-btn:hover { border-color: #6b7280; color: #a1a1aa; }

    .tilt-ticket-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: #52525b;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 0.6rem;
      font-weight: 500;
      transition: all .15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tilt-ticket-btn:hover  { background: var(--border); color: #a1a1aa; }
    .tilt-ticket-btn.active { color: #34d399; background: #0f1f1a; font-weight: 700; }
    .tilt-ticket-btn.busy   { opacity: .5; pointer-events: none; }

    /* ── Deploy button on cards ── */
    .deploy-btn {
      align-self: flex-start;
      background: #0f1a12;
      border: 1px solid #1e3a28;
      color: #4b7a5e;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: .03em;
      transition: all .15s;
    }
    .deploy-btn:hover  { background: #162a1e; border-color: #34d399; color: #34d399; }
    .deploy-btn.active { background: #0f1f1a; border-color: #34d399; color: #34d399; }
    .deploy-btn.busy   { opacity: .5; pointer-events: none; }
    .deploy-btn.ok     { background: #0f1f1a; border-color: #34d399; color: #34d399; }
    .deploy-btn.err    { background: #2a1a1a; border-color: #f87171; color: #f87171; }

    /* active card gets a green left border highlight */
    .card.tilt-active { border-color: #1a3a2a; box-shadow: inset 3px 0 0 #34d399; }

    /* ── Focus mode ── */
    #focus-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 50;
      cursor: pointer;
    }
    #focus-backdrop.visible { display: block; }
    .card.focused {
      box-shadow: 0 0 0 1px #3a3a3a, 0 32px 80px rgba(0, 0, 0, 0.95);
      cursor: default;
    }

    /* ══════════════════════════════════
       StageChecklist view
    ══════════════════════════════════ */

    /* overall progress bar */
    .overall-progress { display:flex; flex-direction:column; gap:4px; }
    .progress-bar-track { height:4px; background:var(--border); border-radius:99px; overflow:hidden; }
    .progress-bar-fill { height:100%; border-radius:99px; }
    .progress-bar-fill.normal  { background:#2563eb; }
    .progress-bar-fill.blocked { background:#ef4444; }
    .progress-bar-fill.waiting { background:#d97706; }
    .progress-label { font-size:0.75rem; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
    .blocker-pill { font-size:0.7rem; font-weight:700; padding:1px 8px; border-radius:99px; display:inline-flex; align-items:center; gap:4px; }
    .blocker-pill.blocked { background:#3b0a0a; color:#f87171; }
    .blocker-pill.waiting { background:#1c1a07; color:#fbbf24; }

    /* timeline rail */
    .cl { display:flex; flex-direction:column; position:relative; padding-left:24px; }
    .cl::before { content:''; position:absolute; left:5px; top:12px; bottom:12px; width:1px; background:var(--border); }
    .cl-stage { display:flex; flex-direction:column; }
    .cl-stage-hdr { display:flex; align-items:center; gap:8px; position:relative; padding:6px 0; cursor:pointer; user-select:none; min-width:0; }
    .cl-node { position:absolute; left:-24px; width:12px; height:12px; border-radius:50%; border:2px solid #333; background:var(--bg); flex-shrink:0; }
    .cl-node.done    { background:#22c55e; border-color:#22c55e; }
    .cl-node.current { background:var(--bg); border-color:#38bdf8; box-shadow:0 0 0 3px #38bdf820; }
    .cl-node.blocked { background:var(--bg); border-color:#ef4444; box-shadow:0 0 0 3px #ef444420; }
    .cl-node.waiting { background:var(--bg); border-color:#d97706; box-shadow:0 0 0 3px #d9770620; }
    .cl-node.future  { border-color:#2a2a2a; }
    .cl-stage-name { flex:1; font-size:0.82rem; font-weight:700; min-width:0; overflow-wrap:break-word; word-break:break-word; }
    .cl-stage-name.done    { color:#2a3a2a; }
    .cl-stage-name.current { color:var(--text); }
    .cl-stage-name.blocked { color:#f87171; }
    .cl-stage-name.waiting { color:#fbbf24; }
    .cl-stage-name.future  { color:var(--muted); }
    /* fraction + bar */
    .cl-frac-bar { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .cl-frac { font-size:0.7rem; font-weight:600; color:var(--muted); white-space:nowrap; }
    .cl-frac.blocked { color:#f87171; }
    .cl-frac.waiting { color:#fbbf24; }
    .cl-frac-track { width:48px; height:3px; background:var(--border); border-radius:99px; overflow:hidden; flex-shrink:0; }
    .cl-frac-fill { height:100%; border-radius:99px; }
    .cl-frac-fill.done    { background:#22c55e; }
    .cl-frac-fill.current { background:#2563eb; }
    .cl-frac-fill.blocked { background:#ef4444; }
    .cl-frac-fill.waiting { background:#d97706; }
    .cl-chevron { font-size:0.6rem; color:#333; transition:transform .15s; flex-shrink:0; }
    .cl-stage.open .cl-chevron { transform:rotate(180deg); color:var(--muted); }
    .cl-body { display:none; padding:2px 0 10px; flex-direction:column; gap:2px; }
    .cl-stage.open .cl-body { display:flex; }
    .cl-pr-row { display:flex; align-items:flex-start; gap:6px; padding:3px 0 6px; min-width:0; }
    .cl-pr-label { font-size:0.68rem; color:#383838; padding-top:4px; flex-shrink:0; }
    .cl-item { display:flex; align-items:flex-start; gap:8px; padding:4px 0; font-size:0.8rem; color:var(--muted); cursor:pointer; line-height:1.4; }
    .cl-item.done    { color:#2a3a2a; text-decoration:line-through; }
    .cl-item.current { color:var(--text); }
    .cl-item.blocked { color:#f87171; }
    .cl-item.waiting { color:#fbbf24; }
    .cl-item input[type=checkbox] { accent-color:#2563eb; width:13px; height:13px; cursor:pointer; flex-shrink:0; margin-top:2px; }

    /* PR chips (checklist view) */
    .pr-chips { display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
    .pr-chip { display:flex; align-items:center; gap:8px; min-width:0; font-size:0.82rem; padding:4px 10px; border-radius:3px; text-decoration:none; border-left:3px solid; background:transparent; color:var(--muted); }
    .pr-chip.merged { border-left-color:#22c55e; }
    .pr-chip.open   { border-left-color:#f59e0b; }
    .pr-chip.closed { border-left-color:#f87171; }
    .pr-chip .pr-chip-icon { font-size:0.78rem; flex-shrink:0; }
    .pr-chip.merged .pr-chip-icon { color:#22c55e; }
    .pr-chip.open   .pr-chip-icon { color:#f59e0b; }
    .pr-chip.closed .pr-chip-icon { color:#f87171; }
    .pr-chip .pr-chip-sep  { color:#333; flex-shrink:0; }
    .pr-chip .pr-chip-repo { color:#52525b; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex-shrink:1; max-width:160px; }
    .pr-chip .pr-chip-num  { font-weight:700; flex-shrink:0; }
    .pr-chip.merged .pr-chip-num { color:#7dd3fc; }
    .pr-chip.open   .pr-chip-num { color:#34d399; }
    .pr-chip.closed .pr-chip-num { color:#f87171; }

    /* blocker / waiting notes */
    .blocker-note { font-size:0.78rem; padding:7px 10px; border-radius:6px; line-height:1.4; display:flex; gap:7px; align-items:flex-start; }
    .blocker-note.blocked { background:#2a0808; border:1px solid #991b1b; color:#fca5a5; }
    .blocker-note.waiting { background:#1c1500; border:1px solid #92400e; color:#fcd34d; }

    /* action button row */
    .card-actions { display:flex; gap:6px; padding-top:10px; border-top:1px solid var(--border); margin-top:auto; align-items:center; }
    .btn { display:inline-flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:600; padding:5px 12px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:inherit; transition:all .15s; }
    .btn:hover { background:#1f1f1f; color:var(--text); border-color:#3a3a3a; }
    .btn-terminal { border-color:#2a5470; color:#7ec8e3; }
    .btn-terminal:hover { background:#071828; color:#38bdf8; border-color:#2563eb; }
    .btn-terminal.lit { background:#071828; color:#38bdf8; border-color:#2563eb; }
    .btn-plan { border-color:#6b5c1e; color:#d4a832; }
    .btn-plan:hover { background:#1a1200; color:#fcd34d; border-color:#a16207; }
    .btn-deploy { background:#0f1a12; border-color:#1e3a28; color:#4b7a5e; }
    .btn-deploy:hover { background:#162a1e; border-color:#34d399; color:#34d399; }
    .btn-deploy.active { background:#0f1f1a; border-color:#34d399; color:#34d399; }
    .btn-spacer { flex:1; }
    .btn-deploy.switching { background:#0f1f1a; border-color:#2a6a4a; color:#34d399; }
    .deploy-spinner {
      width: 10px; height: 10px; flex-shrink: 0;
      border: 2px solid #1a4a30;
      border-top-color: #34d399;
      border-radius: 50%;
      animation: deploy-spin .7s linear infinite;
      display: inline-block;
    }
    @keyframes deploy-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
    }
  }
  </script>

  <script type="module">
    import { createApp } from 'vue'
    import App from './components/App.js'

    createApp(App).mount('#app')
  </script>
</body>
</html>
